name: al_quran_tafsir_and_audio
description: "All in one Al Quran App with Translation, Tefsir, Quran Audio Book & Notes Backup"
publish_to: 'none' 

version: 3.0.0+38-dev-1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.14
  just_audio_mpv: any
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dart_appwrite: ^13.0.0
  shared_preferences: ^2.3.4
  dio: ^5.7.0
  gap: ^3.0.1
  google_fonts: ^6.2.1
  icons_launcher: ^3.0.0
  archive: ^4.0.2
  simple_icons: ^10.1.3
  appwrite: ^14.0.0
  toastification: ^3.0.0
  clipboard: ^0.1.3
  url_launcher: ^6.3.1
  get: ^5.0.0-release-candidate-9.2.1
  http: ^1.2.2
  email_validator: ^3.0.0
  line_icons: ^2.0.3
  fluentui_system_icons: ^1.1.270
  flutter_widget_from_html: ^0.16.0
  audio_video_progress_bar: ^2.0.3
  share_plus: ^10.1.4
  crypto: ^3.0.6
  path_provider: ^2.1.5
  path: ^1.9.0
  hive_generator: ^2.0.1
  scrollable_positioned_list: ^0.3.8
  package_info_plus: ^8.1.3
  cached_network_image: ^3.4.1
  flutter_quill: ^11.0.0-dev.21
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  internet_connection_checker_plus: ^2.7.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_compass: ^0.8.1
  smooth_page_indicator: ^1.2.1
  vector_math: ^2.1.4
  permission_handler: ^11.3.1
  flutter_native_splash: ^2.4.5

dependency_overrides:
  flutter_web_auth_2: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/img/makkah.jpg
    - assets/img/madina.jpeg
    - assets/img/QuranLogo.png
    - assets/img/Quran_Logo_v3.png
    - assets/
    - assets/dev/


icons_launcher:
  image_path: "assets/img/Quran_Logo_v3.png"

  platforms:
    android:
      enable: true
    ios:
      enable: true
    macos:
      enable: true
    windows:
      enable: true
    web:
      enable: true
    linux:
      enable: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/img/Quran_Logo_v3.png
  color_dark: "#000000"

  android_12:
    image: assets/img/Quran_Logo_v3.png
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#000000"
